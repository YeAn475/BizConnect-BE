services:
  mariadb:
    image: mariadb:10.11
    container_name: bizconnect-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: bizconnect
      MYSQL_USER: lsh
      MYSQL_PASSWORD: lsh
    ports:
      - "3307:3306"  # 로컬 3306과 충돌 안 나게
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - bizconnect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizconnect-app
    environment:
      SPRING_PROFILE: prod  # Prod 환경
      SERVER_PORT: 8301
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: bizconnect
      DB_USERNAME: lsh
      DB_PASSWORD: lsh
    ports:
      - "80:8301"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - bizconnect-network
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: bizconnect-jenkins
    privileged: true
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    networks:
      - bizconnect-network
    restart: unless-stopped
    entrypoint: >
      /bin/bash -c "
      apt-get update &&
      apt-get install -y docker.io curl &&
      /usr/bin/tini -- /usr/local/bin/jenkins.sh
      "

volumes:
  mariadb-data:
    driver: local
  jenkins-data:
    driver: local

networks:
  bizconnect-network:
    driver: bridge